function strw(code,hi){const S=SCORES[code];const r=CRIT.map(c=>{const key=c[0]==='New Information'?'ข้อมูลใหม่จาก Oppday':c[0],v=S.crit[key];return [c[0],v[0],v[1]]}).filter(x=>hi?x[1]/x[2]>=.7:x[1]/x[2]<=.4);return r.length?r.map(x=>`${x[0]} ${f(x[1],1)}/${x[2]}`).join('<br>'):'ไม่มีเกณฑ์ที่เข้าเงื่อนไข'}

 <div class="fact"><b>Why should I care?</b><br>${d.final.care}</div><div class="ana"><b>What could drive growth?</b><br>${d.final.drive}</div><div class="warn"><b>What could go wrong?</b><br>${d.final.wrong}</div><div class="ana"><b>What should I investigate next?</b><br>${d.final.next}</div></div>
 <div class="fact" style="margin-top:10px"><b>Should I listen to the full video?</b> ${d.final.listen}</div><div class="small mut" style="margin-top:8px">${d.verify} · ไม่ใช่คำแนะนำซื้อขาย ไม่มีข้อมูลราคาหุ้นหรือ Valuation จึงไม่สรุปว่าถูกหรือแพง</div></div></section>`;
 $('#view').innerHTML=h;
 $$('[data-c]').forEach(el=>counter(el,el.dataset.c==='null'?null:+el.dataset.c,+el.dataset.d,el.dataset.s));
 $$('#rg button').forEach(b=>b.onclick=()=>{range=b.dataset.r;render(true)});
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});$$('section.sec:not(.in)').forEach(s=>io.observe(s))}
const PAL=['#3B82F6','#10B981','#F59E0B','#8b5cf6'];
function donut(items){let a=-90,out='';const r=42,c=2*Math.PI*r;items.forEach((it,i)=>{const len=c*it[1]/100;out+=`<circle data-tip="${it[0]}: ${it[1]}%" cx="60" cy="60" r="${r}" fill="none" stroke="${PAL[i]}" stroke-width="16" stroke-dasharray="${len} ${c-len}" transform="rotate(${a} 60 60)" stroke-dashoffset="0"/>`;a+=360*it[1]/100});return out}
function radarNA(){const n=CRIT.length,R=78,cx=100,cy=100;const pt=(i,k)=>[cx+R*k*Math.cos(-Math.PI/2+2*Math.PI*i/n),cy+R*k*Math.sin(-Math.PI/2+2*Math.PI*i/n)];
 let g='';[.33,.66,1].forEach(k=>g+=`<polygon points="${CRIT.map((c,i)=>pt(i,k).join(',')).join(' ')}" fill="none" stroke="#243653"/>`);CRIT.forEach((c,i)=>{const p=pt(i,1.2);g+=`<line x1="100" y1="100" x2="${pt(i,1)[0]}" y2="${pt(i,1)[1]}" stroke="#243653"/><text x="${p[0]}" y="${p[1]}" text-anchor="middle" style="font-size:8px">${c[0].split(' ')[0]}</text>`});
 return `<svg viewBox="0 0 200 200" width="240"><g>${g}</g><text x="100" y="104" text-anchor="middle" style="font-size:12px;fill:#9AA8BF">N/A</text></svg>`}
function compare(){const sel=cmpSel;
 const rows=sel.map(c=>({c,d:DATA[c]}));
 const bar=(lab,get,fmt,good,asc)=>{const vals=rows.map(r=>get(r.d));const mx=Math.max(...vals.filter(v=>v!=null).map(Math.abs),1);const sgn=asc?-1:1;const ord=[...rows].sort((a,b)=>sgn*((get(b.d)==null?-1e9*sgn:get(b.d))-(get(a.d)==null?-1e9*sgn:get(a.d))));
  return `<div class="card"><h3>${lab}</h3>${ord.map((r,i)=>{const v=get(r.d);return `<div style="margin:9px 0"><div class="row" style="justify-content:space-between"><span>${i+1}. <b>${r.c}</b></span><b class="${v==null?'t-na':good(v)}">${fmt(v)}</b></div><div class="cmpbar"><i style="width:${v==null?0:Math.abs(v)/mx*100}%;background:${v==null?'#243653':good(v)==='dn'?'#EF4444':'#10B981'}"></i></div></div>`}).join('')}</div>`};
 const last=(d,k)=>{const p=d.series[k].pts;return p.length?p[p.length-1][1]:null};
 let h=`<section class="sec in"><h2>⇄ Multi-Company Comparison</h2><div class="row" style="margin-bottom:12px">`+Object.keys(DATA).map(c=>`<label class="pill"><input type="checkbox" data-c="${c}" ${sel.includes(c)?'checked':''}> ${c}</label>`).join('')+`<span class="small mut">เลือกอย่างน้อย 2 บริษัท (ตอนนี้มีข้อมูล 3 บริษัท) · คะแนนไม่ใช่คะแนนความน่าซื้อ และคะแนนต่ำอาจมาจากข้อมูลไม่ครบ (ดูสัดส่วนครอบคลุม) · งวดที่เปรียบเทียบอาจต่างกัน (BCH, CPALL Q2/2569 · HMPRO Q3/2569) ดูงวดในตาราง</span></div>`;
 if(sel.length<2){h+=`<div class="na">เลือกอย่างน้อย 2 บริษัทเพื่อเปรียบเทียบ</div></section>`;$('#view').innerHTML=h;bindCmp();return}
 h+=`<div class="grid g3">${bar('Revenue Growth YoY (งวดล่าสุด)',d=>d.kpi.rev.v,v=>pct(v),v=>v>=0?'up':'dn')}${bar('Net Profit Growth YoY (งวดล่าสุด)',d=>d.kpi.np.v,v=>pct(v),v=>v>=0?'up':'dn')}${bar('Gross Margin (งวดล่าสุด %)',d=>last(d,'gm'),v=>v==null?'N/A':f(v,2)+'%',v=>'up')}
 ${bar('Debt to Equity (เท่า ล่าสุด ต่ำ = ดี)',d=>last(d,'de'),v=>v==null?'N/A':f(v,2),v=>v>1.5?'dn':'up',true)}${bar('ตรวจตัวเลขได้ ตรง (จากที่ตรวจได้)',d=>({BCH:19/22*100,CPALL:24/27*100,HMPRO:10/12*100}[d.sym]),v=>f(v,0)+'%',v=>'up')}
 ${bar('Investment Score Ranking (0–100)',d=>SCORES[d.sym].total,v=>f(v,1),v=>v>=50?'up':'dn')}${bar('Growth Potential (คะแนนเต็ม 20)',d=>SCORES[d.sym].crit['Growth Potential'][0],v=>f(v,1)+' / 20',v=>v>=10?'up':'dn')}${bar('Business Quality (คะแนนเต็ม 15)',d=>SCORES[d.sym].crit['Business Quality'][0],v=>f(v,1)+' / 15',v=>v>=7.5?'up':'dn')}${bar('Risk & Financial Health (เต็ม 10)',d=>SCORES[d.sym].crit['Risk & Financial Health'][0],v=>f(v,1)+' / 10',v=>v>=5?'up':'dn')}<div class="card"><h3>Priority Ranking</h3>${[...rows].sort((a,b)=>SCORES[b.c].total-SCORES[a.c].total).map((r,i)=>`<div class="row" style="justify-content:space-between;margin:10px 0"><span>${i+1}. <b>${r.c}</b></span><span class="pill" style="border-color:${PRI[SCORES[r.c].pri][0]};color:${PRI[SCORES[r.c].pri][0]}">P${SCORES[r.c].pri} · ${f(SCORES[r.c].total,1)}</span></div>`).join('')}<div class="small mut">ข้อมูลครอบคลุม: ${rows.map(r=>r.c+' '+SCORES[r.c].cov+'%').join(' · ')}</div></div></div>
 <div class="card" style="margin-top:14px"><h3>ตารางเปรียบเทียบ</h3><table><tr><th>บริษัท</th><th>งวด</th><th>รายได้ yoy</th><th>กำไรสุทธิ yoy</th><th>Growth Potential (สรุปจากตัวเลข)</th><th>Risk Level</th><th>D/E</th><th>Score / Priority</th></tr>${rows.map(r=>`<tr><td><b>${r.c}</b></td><td>${r.d.period}</td><td class="${cls(r.d.kpi.rev.v)}">${pct(r.d.kpi.rev.v)}</td><td class="${cls(r.d.kpi.np.v)}">${pct(r.d.kpi.np.v)}</td><td>${r.d.kpi.growth.t}</td><td>${r.d.kpi.risk.t}</td><td>D/E ${f(last(r.d,'de'),2)}</td><td><b>${f(SCORES[r.c].total,1)}</b> · P${SCORES[r.c].pri}</td></tr>`).join('')}</table><div class="small mut" style="margin-top:8px">Business Quality เปรียบเทียบด้วยตัวเลขที่ทุกบริษัทมีเท่านั้น (อัตรากำไรขั้นต้นของ BCH และ EBITDA ของ CPALL/HMPRO เป็น N/A)</div></div></section>`;
 $('#view').innerHTML=h;bindCmp()}
function bindCmp(){$$('[data-c]').forEach(i=>i.onchange=()=>{cmpSel=$$('[data-c]:checked').map(x=>x.dataset.c);compare()})}
function render(keep){nav();if(view==='cmp')compare();else{company()}if(!keep)window.scrollTo(0,0)}
(function init(){const ks=Object.keys(DATA);$('#sel').innerHTML=ks.map(k=>`<option value="${k}">${k} — ${DATA[k].name}</option>`).join('');$('#cl').innerHTML=ks.map(k=>`<option value="${k}">${DATA[k].name}</option>`).join('');
 $('#sel').onchange=e=>{cur=e.target.value;view='co';render()};
 $('#q').oninput=e=>{const v=e.target.value.trim().toUpperCase();const hit=ks.find(k=>k===v||DATA[k].name.includes(e.target.value.trim()));if(hit){cur=hit;view='co';$('#sel').value=hit;render()}};
 $('#rm').onchange=e=>{document.body.classList.toggle('rm',e.target.checked);render(true)};
 if(matchMedia('(prefers-reduced-motion:reduce)').matches){$('#rm').checked=true;document.body.classList.add('rm')}
 render()})();
</script>
